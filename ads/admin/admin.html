function AddParam()
{
	var avail = document.forms["admin"].denied;
	var used = document.forms["admin"].granted;

	for (i=0; i<avail.options.length; i++)

			used.options.length ++;
			used.options[n].value = avail.options[i].value;
			used.options[n].text = avail.options[i].text;
		}

	n=0;
	for (i=0; i<avail.options.length; i++)
		if (! avail.options[i].selected)
		{
			avail.options[n].value = avail.options[i].value;
			avail.options[n].text = avail.options[i].text;
			n++;
		}
	avail.options.length = n;
}
function DelParam()
{
	var used = document.forms["admin"].denied;

		if (avail.options[i].selected)

			avail.options[n].value = avail.options[i].value;
			avail.options[n].text = avail.options[i].text;
			n++;
		}
	avail.options.length = n;	
}

	{admin_checks}
