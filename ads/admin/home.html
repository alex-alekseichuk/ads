{header}
  <tr>
    <td align="center" valign="top"><table width="60%" border="0" cellpadding="0" cellspacing="0" class="text">
      <tr>
        <td colspan="3"><table width="100%" border="0" cellpadding="0" cellspacing="0" class="title_table">
            <tr>
              <td width="37"><img src="{HTTP_ROOT}img/tab_l.gif" width="37" height="23" /></td>
              <td align="left" background="{HTTP_ROOT}img/tabl_bg.gif">home page</td>
              <td width="5"><img src="{HTTP_ROOT}img/tabl_r.gif" width="5" height="23" /></td>
            </tr>
        </table></td>
      </tr>
      <tr>
        <td width="1" background="{HTTP_ROOT}img/grey_dot.gif"><img src="{HTTP_ROOT}img/grey_dot.gif" width="1" height="1" /></td>
        <td align="center" class="text"><br>
          {sMessage}
            <table width="80%" border="0" align="center" cellpadding="3" cellspacing="0" class="text">
              <tr>
                <td align="center" class="text_link">
				<!-- begin_admins -->
                  {info} &nbsp;&nbsp;&nbsp;
                  <!-- begin_admins_pager -->
                  <!-- begin_admins_first -->
                  <a href="{url}">First</a>
                  <!-- end_admins_first -->
                  <!-- begin_admins_prev -->
                  <a href="{url}">Prev.</a>
                  <!-- end_admins_prev -->
                  <!-- begin_admins_page -->
                  <!-- begin_admins_link -->
                  <a href="{url}">{page}</a>
                  <!-- end_admins_link -->
                  <!-- begin_admins_curpage -->
                  <b>{page}</b>
                  <!-- end_admins_curpage -->
                  <!-- end_admins_page -->
                  <!-- begin_admins_next -->
                  <a href="{url}">Next</a>
                  <!-- end_admins_next -->
                  <!-- begin_admins_last -->
                  <a href="{url}">Last</a>
                  <!-- end_admins_last -->
                  <!-- end_admins_pager -->
                </td>
              </tr>
              <tr>
                <td align="center" class="text"><table width="80%" border="0" align="center" cellpadding="3" cellspacing="0" class="table_border">
                    <tr class="text_link">
                      <td width="33%" align="center" class="td_bg">
					  <!-- begin_admins_sort_adminid -->
                          <a href="{url}">ID</a>
                          <!-- begin_admins_asc_adminid -->
                          <img src="{HTTP_ROOT}img/asc.gif" width="13" height="6" border="0" />
                          <!-- end_admins_asc_adminid -->
                          <!-- begin_admins_desc_adminid -->
                          <img src="{HTTP_ROOT}img/desc.gif" width="13" height="6" border="0" />
                          <!-- end_admins_desc_adminid -->
                          <!-- end_admins_sort_adminid --></td>
                      <td width="34%" align="center" class="td_bg"><!-- begin_admins_sort_login -->
                          <a href="{url}">Login</a>
                          <!-- begin_admins_asc_login -->
                          <img src="{HTTP_ROOT}img/asc.gif" width="13" height="6" border="0" />
                          <!-- end_admins_asc_login -->
                          <!-- begin_admins_desc_login -->
                          <img src="{HTTP_ROOT}img/desc.gif" width="13" height="6" border="0" />
                          <!-- end_admins_desc_login -->
                          <!-- end_admins_sort_login --></td>
                      <td width="33%" align="center" class="td_bg"><!-- begin_admins_sort_passwd -->
                          <a href="{url}">Password</a>
                          <!-- begin_admins_asc_passwd -->
                          <img src="{HTTP_ROOT}img/asc.gif" width="13" height="6" border="0" />
                          <!-- end_admins_asc_passwd -->
                          <!-- begin_admins_desc_passwd -->
                          <img src="{HTTP_ROOT}img/desc.gif" width="13" height="6" border="0" />
                          <!-- end_admins_desc_passwd -->
                          <!-- end_admins_sort_passwd --></td>
                    </tr>
                    <!-- begin_admins_item -->
                    <tr>
                      <td width="33%" align="center">{adminid}</td>
                      <td width="34%" align="center" class="text_link"><a href="{link}{adminid}&{params}">{login}</a></td>
                      <td width="33%" align="center">{passwd}</td>
                    </tr>
                    <!-- end_admins_item -->
                    <!-- begin_admins_noitems -->
                    <tr>
                      <td colspan="3">No users</td>
                    </tr>
                    <!-- end_admins_noitems -->
                  </table>
                    <br></td>
              </tr>
              <tr>
                <td align="center">{info} &nbsp;&nbsp;&nbsp; {pager2}
                  <!-- end_admins --></td>
              </tr>
            </table>
            <br></td>
        <td width="1" background="{HTTP_ROOT}img/grey_dot.gif"><img src="{HTTP_ROOT}img/grey_dot.gif" width="1" height="1" /></td>
      </tr>
      <tr>
        <td colspan="3" background="{HTTP_ROOT}img/grey_dot.gif"><img src="{HTTP_ROOT}img/grey_dot.gif" width="1" height="1" /></td>
      </tr>
    </table></td>
  </tr>
{footer}
