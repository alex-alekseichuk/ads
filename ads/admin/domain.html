<html>
<head>
<link href="{HTTP_ROOT}img/style.css" rel="stylesheet" type="text/css" />
<script language="JavaScript" type="text/javascript" src="{HTTP_ROOT}img/check.js"></script>
<script language="JavaScript">
<!--
function OnDelete()
{
	if (confirm("Are you sure you want to delete this domain?"))
	{
		location='admin?p=domain&cmd=delete&{params}';
	}
}
function OnSubmit()
{
	var sError = "";


	{domain_checks}

	if (sError) {
		alert("Warning:\n" + sError);
		return false;
	} else {
		return true;
	}
}
//-->
</script>

</head>

<body>
<table width="100%" border="0" cellpadding="5" cellspacing="0" class="text">
  <tr>
    <td><table width="100%" border="0" cellspacing="0" cellpadding="0">
      <tr>
        <td width="53"><img src="{HTTP_ROOT}img/h1.gif" width="53" height="33" /></td>
        <td align="center" background="{HTTP_ROOT}img/h_bg.gif"><table border="0" cellpadding="3" cellspacing="0" class="topmenu">
          <tr align="center">
            <td><a href="admin?p=advertisers">Advertisers</a></td>
            <td valign="top"><img src="{HTTP_ROOT}img/break.gif" width="12" height="8" /></td>
            <td><a href="admin?p=publishers">Publishers</a></td>
			<td valign="top"><img src="{HTTP_ROOT}img/break.gif" width="12" height="8" /></td>
            <td><a href="admin?p=rep_campaigns">Reports</a></td>
			<td valign="top"><img src="{HTTP_ROOT}img/break.gif" width="12" height="8" /></td>
            <td><a href="admin?p=admins">Admins</a></td>
			<td valign="top"><img src="{HTTP_ROOT}img/break.gif" width="12" height="8" /></td>
            <td><a href="admin?p=domains">Domains</a></td>
			<td valign="top"><img src="{HTTP_ROOT}img/break.gif" width="12" height="8" /></td>
            <td><a href="admin?p=options">Options</a></td>
			<td valign="top"><img src="{HTTP_ROOT}img/break.gif" width="12" height="8" /></td>
            <td><a href="admin?p=login&amp;cmd=logout">Logout</a></td>
          </tr>
        </table></td>
        <td width="53"><img src="{HTTP_ROOT}img/h2.gif" width="53" height="33" /></td>
      </tr>
    </table></td>
  </tr>
  <tr>
    <td align="center" valign="top" class="text_link"><a href="admin?p=domains&{params}">Domains</a> /
{sTitle}<br>
<br>
<table width="40%" border="0" cellpadding="0" cellspacing="0" class="text">
      <tr>
        <td colspan="3"><table width="100%" border="0" cellpadding="0" cellspacing="0" class="title_table">
          <tr>
            <td width="37"><img src="{HTTP_ROOT}img/tab_l.gif" width="37" height="23" /></td>
                <td align="left" background="{HTTP_ROOT}img/tabl_bg.gif">{sTitle}</td>
                <td width="5"><img src="{HTTP_ROOT}img/tabl_r.gif" width="5" height="23" /></td>
              </tr>
          </table></td>
        </tr>
      <tr>
        <td width="1" background="{HTTP_ROOT}img/grey_dot.gif"><img src="{HTTP_ROOT}img/grey_dot.gif" width="1" height="1" /></td>
          <td align="center" class="text"><br>
            <span class="font_red">{sMessage}            </span>
            <form name="domain" action="admin?p=domain&{params}" method="post" onSubmit="return OnSubmit();">
            <table align="center" cellpadding="5" class="text">
              <tr>
                <td align="right" class="text_link"><input type="hidden" name="cmd" value="{cmd}">
                  <input type="hidden" name="domainId" value="{domainId}">
Domain</td>
                <td align="left" class="input"><input type="text" name="domain" value="{domain}" /></td>
              </tr>
              <tr class="btn">
                <td colspan="2" align="center"><input name="submit" type="submit" value="{sCmd}">
                  <input name="button" type="button" onClick="location='admin?p=domains&{params}';" value="Cancel">
                  <!-- begin_bDelete -->
                  <input name="button" type="button" onClick="OnDelete();" value="Delete">
                <!-- end_bDelete --></td>
              </tr>
            </table>
</form>
            <br></td>
          <td width="1" background="{HTTP_ROOT}img/grey_dot.gif"><img src="{HTTP_ROOT}img/grey_dot.gif" width="1" height="1" /></td>
        </tr>
      <tr>
        <td colspan="3" background="{HTTP_ROOT}img/grey_dot.gif"><img src="{HTTP_ROOT}img/grey_dot.gif" width="1" height="1" /></td>
        </tr>
    </table></td></tr>
  <tr>
    <td><table width="100%" border="0" cellpadding="0" cellspacing="0" class="footer">
      <tr>
        <td background="{HTTP_ROOT}img/fot_dot.gif"><img src="{HTTP_ROOT}img/fot_dot.gif" width="1" height="1" /></td>
      </tr>
      <tr>
        <td height="30" align="center">2006 &copy; Admin area</td>
      </tr>
    </table></td>
  </tr>
</table>
</body>
</html>
