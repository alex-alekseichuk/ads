
PerlSwitches -wT
#PerlWarn On
#PerlTaintCheck On

#<IfDefine !MODPERL2>
#    PerlFreshRestart On
#</IfDefine>

PerlInitHandler Apache::Reload

PerlRequire "C:/Perl/Apache2/conf/startup.pl"


#Alias /ads/ "/Temp/ads/ads/"
Alias /ads/ "/Perl/Apache2/ads/"


PerlModule Ads::Admin
<Location /ads/proc/admin>
  SetHandler perl-script
  PerlResponseHandler Ads::Admin
  Options +ExecCGI
  PerlOptions +ParseHeaders
</Location>

PerlModule Ads::Advertiser
<Location /ads/proc/advertiser>
  SetHandler perl-script
  PerlResponseHandler Ads::Advertiser
  Options +ExecCGI
  PerlOptions +ParseHeaders
</Location>

PerlModule Ads::Publisher
<Location /ads/proc/publisher>
  SetHandler perl-script
  PerlResponseHandler Ads::Publisher
  Options +ExecCGI
  PerlOptions +ParseHeaders
</Location>

PerlModule Ads::Action
<Location /ads/proc/action>
  SetHandler perl-script
  PerlResponseHandler Ads::Action
  Options +ExecCGI
  PerlOptions +ParseHeaders
</Location>




# for ModPerl::Registry scripts
Alias /perl/ "C:/Perl/Apache2/perl/"
<Location /perl>
  SetHandler perl-script
  PerlResponseHandler ModPerl::Registry
  Options +ExecCGI
  PerlOptions +ParseHeaders
</Location>


# a hello-world handler
PerlModule Apache::Hello
<Location /hello>
  SetHandler perl-script
  PerlResponseHandler Apache::Hello
</Location>

# Apache::ASP pages
PerlModule Apache::ASP
Alias /asp/ "C:/Perl/Apache2/asp/"
<Location /asp>
  SetHandler perl-script
  PerlResponseHandler Apache::ASP
  PerlSetVar Global .
  PerlSetVar StateDir "C:/Perl/Apache2/asp/state"
</Location>

# HTML::Mason pages
PerlModule HTML::Mason::ApacheHandler2
Alias /mason/ "C:/Perl/Apache2/mason/"
<Directory "C:/Perl/Apache2/mason">
#  PerlSetVar MasonArgsMethod CGI
  PerlSetVar MasonDataDir "C:/Perl/Apache2/mason/data"
  PerlSetVar MasonCompRoot "C:/Perl/Apache2/mason"
  SetHandler perl-script
  PerlResponseHandler HTML::Mason::ApacheHandler2
  PerlOptions +GlobalRequest
</Directory>

# Template::Toolkit
PerlLoadModule Apache::Template
PerlModule Apache::MyTTHandler
TT2ServiceModule Apache::MyTTHandler
TT2EvalPerl On
TT2IncludePath "C:/Perl/Apache2/tt2/templates"
TT2PostChomp On
TT2PreProcess header
TT2PostProcess footer

Alias /tt2/ "C:/Perl/Apache2/tt2/"
Alias /template/ "C:/Perl/Apache2/template/"
<Location /template>
  SetHandler perl-script
  PerlResponseHandler Apache::Template
</Location>



